<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B2138">
<meta name="description" content="A shared itinerary for Seoul, Osaka &amp; Tokyo, October 2026.">
<title>Seoul → Japan · Oct 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AE%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink:#1B2138;
    --ink-soft:#565A72;
    --ink-faint:#8C90A3;
    --paper:#EFE7D8;
    --paper-rgb:239,231,216;
    --card:#FBF8F1;
    --card-rgb:251,248,241;
    --line:#DCD2BC;
    --amber:#C6842C;
    --amber-soft:#F1DFB9;
    --amber-ink:#8A5C1D;
    --red:#B23A2E;
    --red-soft:#F0D6CE;
    --red-ink:#7E271D;
    --green:#4B6B4C;
    --green-soft:#DAE4D3;
    --green-ink:#324832;
    --plum:#6B4A6E;
    --plum-soft:#E3D8E4;
    --plum-ink:#4C3450;
    --teal:#2E6B6B;
    --teal-soft:#D3E4E1;
    --teal-ink:#1D4444;
    --grey:#7A7C86;
    --grey-soft:#E7E4DD;
    --radius-sm:10px;
    --radius:16px;
    --radius-lg:26px;
    --shadow-sm:0 1px 2px rgba(27,33,56,0.06), 0 1px 1px rgba(27,33,56,0.04);
    --shadow-md:0 8px 24px -8px rgba(27,33,56,0.18), 0 2px 8px -2px rgba(27,33,56,0.08);
    --shadow-lg:0 24px 60px -20px rgba(27,33,56,0.35);
    --ease:cubic-bezier(.22,1,.36,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --nav-w:280px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(1200px 600px at 100% -10%, rgba(198,132,44,0.08), transparent 60%),
      radial-gradient(900px 500px at -10% 20%, rgba(107,74,110,0.07), transparent 55%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber-soft);color:var(--amber-ink);}
  a{color:inherit;}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important;}
  }

  /* ---------- App shell ---------- */
  .app{
    display:flex;
    min-height:100dvh;
  }

  /* Desktop rail nav */
  .rail{
    display:none;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
    width:100%;
    padding-bottom:96px;
    position:relative;
  }

  /* ---------- Hero ---------- */
  header.hero{
    position:relative;
    color:var(--paper);
    padding:0;
    border-radius:0 0 28px 28px;
    overflow:hidden;
    isolation:isolate;
  }
  header.hero .hero-bg{
    position:absolute;inset:0;
    background-size:cover;
    background-position:center 42%;
    transform:scale(1.06);
    filter:saturate(1.05);
    transition:background-image .5s var(--ease);
  }
  header.hero .hero-scrim{
    position:absolute;inset:0;
    background:
      linear-gradient(180deg, rgba(15,17,30,0.15) 0%, rgba(15,17,30,0.55) 62%, rgba(15,17,30,0.88) 100%);
  }
  header.hero .hero-inner{
    position:relative;
    padding:22px 20px 24px;
    padding-top:max(22px, env(safe-area-inset-top));
  }
  header.hero .eyebrow{
    display:flex;align-items:center;gap:8px;
    font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:rgba(239,231,216,0.75);
    margin:0 0 10px;
  }
  header.hero .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px rgba(198,132,44,0.25);}
  header.hero .route{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(24px, 6.5vw, 34px);
    line-height:1.16;
    letter-spacing:0.1px;
    margin:0 0 6px;
    max-width:22ch;
  }
  header.hero .route .arrow{color:var(--amber);padding:0 3px;font-weight:400;}
  header.hero .dates{
    font-size:14.5px;
    color:rgba(239,231,216,0.82);
    margin:0 0 18px;
    display:flex;align-items:center;gap:8px;
  }
  header.hero .countdown{
    display:inline-flex;
    align-items:center;
    gap:9px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px) saturate(1.4);
    -webkit-backdrop-filter:blur(10px) saturate(1.4);
    border:1px solid rgba(255,255,255,0.22);
    padding:9px 16px 9px 9px;
    border-radius:999px;
    box-shadow:var(--shadow-sm);
  }
  header.hero .countdown .cd-badge{
    width:34px;height:34px;border-radius:50%;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:14px;
    color:#2b1d08;
    flex:0 0 auto;
  }
  header.hero .countdown b{
    font-family:'Fraunces',serif;
    font-size:16px;
    color:var(--paper);
    font-weight:600;
  }
  header.hero .countdown span{font-size:12.5px;color:rgba(239,231,216,0.78);}

  /* Leg strip inside hero */
  .leg-strip{
    display:flex;
    gap:6px;
    margin-top:16px;
  }
  .leg-strip .leg{
    flex:1;
    height:4px;
    border-radius:99px;
    background:rgba(255,255,255,0.22);
    position:relative;
    overflow:hidden;
  }
  .leg-strip .leg.done{background:var(--amber);}
  .leg-strip .leg.active::after{
    content:'';position:absolute;inset:0;background:var(--amber);
    animation:pulse-leg 1.8s var(--ease) infinite;
  }
  @keyframes pulse-leg{0%,100%{opacity:1;}50%{opacity:.45;}}

  /* ---------- Chips / filter nav ---------- */
  .chips{
    display:flex;
    gap:8px;
    padding:18px 16px 6px;
    overflow-x:auto;
    scrollbar-width:none;
    position:sticky;
    top:0;
    z-index:30;
    background:linear-gradient(180deg, var(--paper) 68%, rgba(var(--paper-rgb),0));
    padding-bottom:14px;
    margin-bottom:-8px;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
    transition:transform .18s var(--ease), background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .chip:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);}
  .chip:active{transform:translateY(0) scale(.97);}
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
    box-shadow:var(--shadow-sm);
  }
  .chip.discover{border-style:dashed;border-color:var(--amber);color:var(--amber-ink);}
  .chip.discover.active{background:var(--amber);border-color:var(--amber);color:var(--card);}

  main{padding:6px 16px 20px;}

  /* ---------- Day dividers ---------- */
  .day-divider{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin:26px 2px 12px;
    opacity:0;
    animation:rise .5s var(--ease) forwards;
  }
  .day-divider .dow{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    color:var(--ink);
  }
  .day-divider .full{
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .day-divider::after{
    content:'';
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--line), transparent);
  }
  .day-divider.today .dow{color:var(--red);}
  .day-divider.today .full{color:var(--red);font-weight:600;}
  .day-divider.today .dow::before{
    content:'';display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--red);margin-right:7px;vertical-align:middle;
    box-shadow:0 0 0 4px var(--red-soft);
  }

  /* ---------- Cards ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 15px;
    margin-bottom:10px;
    display:flex;
    gap:13px;
    align-items:flex-start;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:transform .22s var(--ease), box-shadow .22s var(--ease), border-color .22s var(--ease);
    opacity:0;
    transform:translateY(10px);
    animation:rise .5s var(--ease) forwards;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
    border-color:rgba(27,33,56,0.14);
  }
  .card:active{transform:translateY(0) scale(.995);}
  @keyframes rise{to{opacity:1;transform:translateY(0);}}

  .card .icon{
    width:38px;height:38px;
    border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 38px;
    margin-top:1px;
    transition:transform .25s var(--ease-spring);
  }
  .card:hover .icon{transform:scale(1.08) rotate(-4deg);}
  .icon svg{width:18px;height:18px;}
  .type-flight .icon{background:var(--amber-soft);}
  .type-flight .icon svg{stroke:var(--amber-ink);}
  .type-stay .icon{background:var(--green-soft);}
  .type-stay .icon svg{stroke:var(--green-ink);}
  .type-food .icon{background:var(--red-soft);}
  .type-food .icon svg{stroke:var(--red-ink);}
  .type-bar .icon{background:var(--teal-soft);}
  .type-bar .icon svg{stroke:var(--teal-ink);}
  .type-activity .icon{background:var(--plum-soft);}
  .type-activity .icon svg{stroke:var(--plum-ink);}
  .type-note .icon{background:var(--grey-soft);}
  .type-note .icon svg{stroke:#4A4B54;}

  .card .body{flex:1;min-width:0;}
  .card .top-row{
    display:flex;justify-content:space-between;gap:8px;align-items:flex-start;
  }
  .card .title{
    font-weight:600;
    font-size:15.5px;
    color:var(--ink);
    line-height:1.32;
    letter-spacing:-.1px;
  }
  .card .time{
    font-variant-numeric:tabular-nums;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    white-space:nowrap;
    padding-top:2px;
  }
  .card .meta{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:4px;
    line-height:1.45;
  }
  .card .tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
  .tag{
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    background:var(--grey-soft);
    color:var(--ink-soft);
    letter-spacing:.02em;
  }
  .tag.idea{background:var(--amber-soft);color:var(--amber-ink);}
  .tag.booked{background:var(--green-soft);color:var(--green-ink);}
  .tag.booked::before{content:'✓ ';}

  .empty{
    text-align:center;
    padding:64px 24px;
    color:var(--ink-soft);
    opacity:0;
    animation:rise .5s var(--ease) forwards;
  }
  .empty .emoji{font-size:34px;margin-bottom:10px;display:block;}
  .empty .big{
    font-family:'Fraunces',serif;
    font-size:19px;
    color:var(--ink);
    margin-bottom:6px;
    font-weight:600;
  }
  .discover-cta{
    margin-top:26px;
    background:linear-gradient(135deg, var(--card), var(--amber-soft) 220%);
    border:1px dashed var(--amber);
    border-radius:var(--radius);
    padding:18px;
    text-align:center;
    font-weight:700;
    font-size:14.5px;
    color:var(--amber-ink);
    cursor:pointer;
    transition:transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  .discover-cta:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}

  /* ---------- Discover ---------- */
  .discover-hero{
    height:132px;
    border-radius:var(--radius);
    overflow:hidden;
    position:relative;
    margin-bottom:14px;
    background-size:cover;background-position:center;
    box-shadow:var(--shadow-sm);
  }
  .discover-hero::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(15,17,30,0.05), rgba(15,17,30,0.65));
  }
  .discover-hero .dh-label{
    position:absolute;left:14px;bottom:12px;color:var(--paper);
    font-family:'Fraunces',serif;font-weight:600;font-size:19px;z-index:1;
  }
  .subtabs{
    display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
    margin:14px 0 4px;
  }
  .subtabs::-webkit-scrollbar{display:none;}
  .subtab{
    flex:0 0 auto;
    padding:7px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:all .18s var(--ease);
  }
  .subtabs.city .subtab{background:var(--card);border:1px solid var(--line);color:var(--ink-soft);}
  .subtabs.city .subtab.active{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .subtabs.cat .subtab{background:transparent;border:none;color:var(--ink-soft);padding:7px 4px;border-bottom:2px solid transparent;border-radius:0;margin-right:8px;}
  .subtabs.cat .subtab.active{color:var(--ink);border-bottom-color:var(--amber);}
  .suggest-sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:12px 2px 14px;
  }
  .sg-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:13px 14px;
    margin-bottom:10px;
    display:flex;
    gap:12px;
    align-items:center;
    box-shadow:var(--shadow-sm);
    opacity:0;transform:translateY(8px);
    animation:rise .45s var(--ease) forwards;
    transition:transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  .sg-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .sg-card .body{flex:1;}
  .sg-card .title{font-weight:600;font-size:14.5px;letter-spacing:-.1px;}
  .title-link{
    color:inherit;
    text-decoration:none;
    background-image:linear-gradient(currentColor, currentColor);
    background-repeat:no-repeat;
    background-position:0 100%;
    background-size:0% 1px;
    padding-bottom:1px;
    transition:background-size .2s var(--ease), color .2s var(--ease);
  }
  .title-link:hover{
    color:var(--amber-ink);
    background-size:100% 1px;
  }
  .title-link::after{
    content:'↗';
    font-size:0.72em;
    margin-left:4px;
    opacity:.55;
    display:inline-block;
    transform:translateY(-1px);
  }
  .sg-card .meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.45;}
  .sg-add{
    flex:0 0 auto;
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    font-size:19px;
    line-height:1;
    cursor:pointer;
    transition:all .2s var(--ease-spring);
  }
  .sg-add:hover{background:var(--ink);color:var(--card);transform:scale(1.08);}
  .sg-add:active{transform:scale(.92);}
  .sg-add.added{
    background:var(--green);
    border-color:var(--green);
    color:var(--card);
    font-size:15px;
  }
  .sg-add.added:hover{transform:none;background:var(--green);}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;
    right:22px;
    bottom:26px;
    width:60px;height:60px;
    border-radius:50%;
    background:var(--red);
    background-image:linear-gradient(135deg, #C2483A, var(--red));
    color:var(--card);
    border:none;
    font-size:29px;
    box-shadow:0 10px 24px -6px rgba(178,58,46,0.5), 0 2px 8px rgba(178,58,46,0.3);
    cursor:pointer;
    z-index:40;
    transition:transform .25s var(--ease-spring), box-shadow .25s var(--ease);
  }
  .fab:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 14px 30px -6px rgba(178,58,46,0.55);}
  .fab:active{transform:scale(.92);}

  /* ---------- Sheet / Modal ---------- */
  .scrim{
    position:fixed;inset:0;
    background:rgba(15,17,30,0.5);
    backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;
    transition:opacity .25s var(--ease);
    z-index:50;
  }
  .scrim.open{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--paper);
    border-radius:22px 22px 0 0;
    max-height:90vh;
    overflow-y:auto;
    transform:translateY(100%);
    transition:transform .32s var(--ease-spring);
    z-index:51;
    padding:6px 20px calc(24px + env(safe-area-inset-bottom));
    box-shadow:var(--shadow-lg);
    pointer-events:none;
  }
  .sheet.open{transform:translateY(0);pointer-events:auto;}
  .sheet-handle{
    width:38px;height:4px;background:var(--line);
    border-radius:99px;margin:12px auto 16px;
  }
  .sheet h2{
    font-family:'Fraunces',serif;
    font-size:20px;
    margin:0 0 16px;
    font-weight:600;
  }
  .type-select{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:18px;
  }
  .type-opt{
    border:1.5px solid var(--line);
    background:var(--card);
    border-radius:12px;
    padding:10px 2px;
    text-align:center;
    cursor:pointer;
    transition:all .18s var(--ease);
  }
  .type-opt:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);}
  .type-opt svg{width:18px;height:18px;stroke:var(--ink-soft);transition:stroke .18s;}
  .type-opt .lbl{display:block;font-size:10.5px;margin-top:5px;color:var(--ink-soft);font-weight:600;}
  .type-opt.sel{border-color:var(--ink);background:var(--ink);}
  .type-opt.sel svg{stroke:var(--paper);}
  .type-opt.sel .lbl{color:var(--paper);}
  label.field{display:block;margin-bottom:14px;}
  label.field .lbl{
    display:block;font-size:12.5px;font-weight:700;
    color:var(--ink-soft);margin-bottom:6px;
    letter-spacing:.01em;
  }
  .field input[type=text],
  .field input[type=date],
  .field input[type=time],
  .field input[type=url],
  .field textarea,
  .field select{
    width:100%;
    border:1.5px solid var(--line);
    background:var(--card);
    border-radius:11px;
    padding:12px 13px;
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .field input:focus,
  .field textarea:focus,
  .field select:focus{
    outline:none;
    border-color:var(--ink);
    box-shadow:0 0 0 3px rgba(27,33,56,0.08);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .status-toggle{display:flex;gap:8px;}
  .status-toggle button{
    flex:1;
    padding:11px;
    border-radius:11px;
    border:1.5px solid var(--line);
    background:var(--card);
    font-weight:700;
    font-size:13.5px;
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .18s var(--ease);
  }
  .status-toggle button.sel-idea.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-ink);}
  .status-toggle button.sel-booked.on{background:var(--green-soft);border-color:var(--green);color:var(--green-ink);}
  .sheet-actions{
    display:flex;gap:10px;margin-top:8px;
  }
  .btn{
    flex:1;
    padding:14px;
    border-radius:12px;
    border:none;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:transform .18s var(--ease-spring), box-shadow .18s var(--ease), opacity .18s;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(0) scale(.98);}
  .btn-primary{background:var(--ink);color:var(--paper);box-shadow:var(--shadow-sm);}

    .rail-legs{margin-top:auto;padding-top:18px;border-top:1px solid var(--line);}

  }

  {city:'Tokyo', cat:'museum', title:'Nezu Museum', notes:'Omotesando — traditional Japanese and Asian art with a stunning garden.'},
  {city:'Tokyo', cat:'museum', title:'Sumida Hokusai Museum', notes:'Ryogoku — dedicated to Hokusai, striking angular building.'},
  {city:'Tokyo', cat:'museum', title:'Ghibli Museum', notes:'Mitaka — reservation-only, sells out weeks ahead.'}
];
const DISCOVER_CATS = [
  {k:'food', label:'Restaurants'},
  {k:'bar', label:'Bars'},
  {k:'museum', label:'Museums & galleries'},
  {k:'festival', label:'Festivals & events'}
];
const CITY_IMAGES = {
  'Seoul':'https://images.unsplash.com/photo-1517154421773-0529f29ea451?auto=format&fit=crop&w=1400&q=70',
  'Osaka':'https://images.unsplash.com/photo-1590559899731-a382839e5549?auto=format&fit=crop&w=1400&q=70',
  'Tokyo':'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=1400&q=70',
  'Kyoto':'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1400&q=70',
  'Japan':'https://images.unsplash.com/photo-1524413840807-0c3cb6fa808d?auto=format&fit=crop&w=1400&q=70',
  'default':'https://images.unsplash.com/photo-1517154421773-0529f29ea451?auto=format&fit=crop&w=1400&q=70'
};
const LEGS = [
  {city:'Seoul', from:'2026-10-17', to:'2026-10-21'},
  {city:'Osaka', from:'2026-10-21', to:'2026-10-26'},
  {city:'Tokyo', from:'2026-10-26', to:'2026-10-31'}
];
let items = [];
let activeFilter = 'all';
let editingId = null;
let discoverCat = 'food';
let discoverCity = 'Seoul';
function uid(){ return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function toast(msg, isErr){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}
function setSync(state){
  const pill = document.getElementById('syncPill');
  const txt = document.getElementById('syncText');
  pill.classList.remove('saving','err');
  if(state === 'saving'){ pill.classList.add('saving','show'); txt.textContent = 'Saving…'; }
  else if(state === 'err'){ pill.classList.add('err','show'); txt.textContent = "Couldn't sync"; }
  else if(state === 'synced'){ pill.classList.add('show'); txt.textContent = 'Synced'; clearTimeout(pill._t); pill._t = setTimeout(()=>pill.classList.remove('show'), 1800); }
}
async function load(){
  try{
    const res = await fetch(API_URL, { headers:{'accept':'application/json'} });
    if(!res.ok) throw new Error('bad status ' + res.status);
    const text = await res.text();
    items = text ? JSON.parse(text) : null;
    if(!items || !Array.isArray(items) || items.length === 0){
      items = DEFAULT_ITEMS.slice();
      await persist();
    }
  }catch(e){
    items = DEFAULT_ITEMS.slice();
    toast("Couldn't load — showing defaults", true);
  }
  render();
}
async function persist(){
  setSync('saving');
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify(items)
    });
    if(!res.ok) throw new Error('bad status ' + res.status);
    setSync('synced');
  }catch(e){
    setSync('err');
    toast("Couldn't save — try again", true);
  }
}
function fmtDay(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return {
    dow: d.toLocaleDateString('en-NZ', {weekday:'short'}).toUpperCase(),
    full: d.toLocaleDateString('en-NZ', {day:'numeric', month:'short'})
  };
}
function fmtTime(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const ap = h >= 12 ? 'pm' : 'am';
  const h12 = ((h+11)%12)+1;
  return m ? `${h12}:${String(m).padStart(2,'0')}${ap}` : `${h12}${ap}`;
}
function currentLeg(){
  const now = new Date();
  for(const leg of LEGS){
    if(now >= new Date(leg.from+'T00:00:00') && now < new Date(leg.to+'T23:59:59')) return leg.city;
  }
  if(now < TRIP_START) return LEGS[0].city;
  return LEGS[LEGS.length-1].city;
}
function updateHeroImage(){
  const city = activeFilter === 'discover' ? discoverCity : currentLeg();
  const img = CITY_IMAGES[city] || CITY_IMAGES.default;
  const bg = document.getElementById('heroBg');
  bg.style.backgroundImage = `url('${img}')`;
}
function updateCountdown(){
  const now = new Date();
  let num, label;
  if(now < TRIP_START){
    const days = Math.ceil((TRIP_START - now)/86400000);
    num = days; label = days === 1 ? 'day to go' : 'days to go';
  } else if(now <= TRIP_END){
    const day = Math.floor((now - TRIP_START)/86400000) + 1;
    num = day; label = 'of 15, on the trip';
  } else {
    num = '✓'; label = 'trip done';
  }
  document.getElementById('cdNum').textContent = num;
  document.getElementById('cdLabel').textContent = label;
  document.getElementById('cdBadge').textContent = (typeof num === 'number') ? num : '✓';
  document.getElementById('cdNumRail').textContent = num;
  document.getElementById('cdLabelRail').textContent = label;
  renderLegStrip();
}
function renderLegStrip(){
  const now = new Date();
  const el = document.getElementById('legStrip');
  const railEl = document.getElementById('railLegs');
  let stripHtml = '', railHtml = '';
  LEGS.forEach(leg => {
    const from = new Date(leg.from+'T00:00:00'), to = new Date(leg.to+'T23:59:59');
    const done = now >= to;
    const active = now >= from && now < to;
    stripHtml += `<div class="leg ${done?'done':''} ${active?'active':''}" title="${leg.city}"></div>`;
    railHtml += `<div class="leg-row ${done?'done':''} ${active?'active':''}"><span class="ldot"></span>${leg.city}</div>`;
  });
  el.innerHTML = stripHtml;
  if(railEl) railEl.innerHTML = railHtml;
}
function setFilter(t){
  activeFilter = t;
  render();
  document.getElementById('main').scrollIntoView({block:'start', behavior:'smooth'});
}
function renderChips(){
  const types = ['all','flight','stay','food','bar','activity','note','discover'];
  const labels = {all:'All', flight:'Flights', stay:'Stays', food:'Food', bar:'Bars', activity:'Do', note:'Notes', discover:'Discover'};
  const el = document.getElementById('chips');
  const railEl = document.getElementById('railNav');
  const chipsHtml = types.map(t =>
    `<div class="chip ${t==='discover'?'discover':''} ${t===activeFilter?'active':''}" data-t="${t}">${labels[t]}</div>`
  ).join('');
  el.innerHTML = chipsHtml;
  if(railEl) railEl.innerHTML = chipsHtml;
  [...el.children, ...(railEl ? railEl.children : [])].forEach(c => c.onclick = () => setFilter(c.dataset.t));
}
function render(){
  renderChips();
  updateCountdown();
  updateHeroImage();
  const main = document.getElementById('main');
  if(activeFilter === 'discover'){
    main.innerHTML = discoverHTML();
    wireDiscover();
    return;
  }
  const filtered = items.filter(i => activeFilter === 'all' || i.type === activeFilter);
  const dated = filtered.filter(i => i.date).sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  const undated = filtered.filter(i => !i.date);
  let html = '';
  if(dated.length === 0 && undated.length === 0){
    html += `<div class="empty"><span class="emoji">🧭</span><div class="big">Nothing here yet</div>Tap + to add a flight, stay, restaurant or something to do — or browse Discover for ideas.</div>`;
    main.innerHTML = html;
    return;
  }
  html += `<div class="card-grid">`;
  let lastDate = null;
  const now = new Date();
  const todayStr = now.toISOString().slice(0,10);
  dated.forEach(item => {
    if(item.date !== lastDate){
      const {dow, full} = fmtDay(item.date);
      const isToday = item.date === todayStr;
      html += `<div class="day-divider ${isToday?'today':''}"><span class="dow">${dow}</span><span class="full">${full}${isToday?' · today':''}</span></div>`;
      lastDate = item.date;
    }
    html += cardHTML(item);
  });
  if(undated.length){
    if(dated.length){
      html += `<div class="day-divider"><span class="dow">Someday</span><span class="full">no date yet</span></div>`;
    }
    undated.forEach(item => html += cardHTML(item));
  }
  html += `</div>`;
  if(activeFilter === 'all'){
    html += `<div class="discover-cta" id="discoverCta">Browse cocktail bars, museums &amp; festivals we've picked out →</div>`;
  }
  main.innerHTML = html;
  main.querySelectorAll('.card[data-id]').forEach((c,idx) => {
    c.style.animationDelay = (idx * 0.03) + 's';
    c.onclick = () => openEdit(c.dataset.id);
  });
  main.querySelectorAll('.day-divider').forEach((d,idx) => { d.style.animationDelay = (idx * 0.04) + 's'; });
  const cta = document.getElementById('discoverCta');
  if(cta) cta.onclick = () => setFilter('discover');
}
function cardHTML(item){
  const timeStr = item.time ? fmtTime(item.time) : '';
  let metaBits = [];
  if(item.type === 'flight' && item.flightNo) metaBits.push(item.flightNo);
  if(item.city) metaBits.push(item.city);
  if(item.endDate) metaBits.push('until ' + fmtDay(item.endDate).full);
  const meta = metaBits.join(' · ');
  const tagsHtml = (item.type !== 'flight' && item.status)
    ? `<div class="tags"><span class="tag ${item.status}">${item.status === 'booked' ? 'Booked' : 'Idea'}</span></div>` : '';
  return `<div class="card type-${item.type}" data-id="${item.id}">
    <div class="icon">${ICONS[item.type]}</div>
    <div class="body">
      <div class="top-row"><span class="title">${titleLinkHTML(item.title, item.city)}</span><span class="time">${timeStr}</span></div>
      ${meta ? `<div class="meta">${escapeHtml(meta)}</div>` : ''}
      ${tagsHtml}
    </div>
  </div>`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function searchLink(title, city){
  const q = [title, city].filter(Boolean).join(' ');
  return 'https://www.google.com/search?q=' + encodeURIComponent(q);
}
function titleLinkHTML(title, city){
  return `<a class="title-link" href="${searchLink(title, city)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${escapeHtml(title)}</a>`;
}
function discoverHTML(){
  const citiesForCat = [...new Set(DISCOVER.filter(d => d.cat === discoverCat).map(d => d.city))];
  if(!citiesForCat.includes(discoverCity)) discoverCity = citiesForCat[0];
  const heroImg = CITY_IMAGES[discoverCity] || CITY_IMAGES.default;
  let html = `<div class="discover-hero" style="background-image:url('${heroImg}')"><span class="dh-label">${escapeHtml(discoverCity)}</span></div>`;
  html += `<div class="subtabs cat">`;
  DISCOVER_CATS.forEach(c => {
    html += `<div class="subtab ${c.k===discoverCat?'active':''}" data-cat="${c.k}">${c.label}</div>`;
  });
  html += `</div>`;
  html += `<div class="subtabs city">`;
  citiesForCat.forEach(c => {
    html += `<div class="subtab ${c===discoverCity?'active':''}" data-city="${c}">${c}</div>`;
  });
  html += `</div>`;
  html += `<p class="suggest-sub">Tap + to add one to your trip.</p>`;
  const list = DISCOVER.filter(d => d.cat === discoverCat && d.city === discoverCity);
  html += `<div class="sg-grid">`;
  list.forEach((d, idx) => {
    const already = items.some(i => i.title.toLowerCase() === d.title.toLowerCase());
    const dateBit = d.date ? fmtDay(d.date).full + (d.endDate ? '–' + fmtDay(d.endDate).full : '') : null;
    html += `<div class="sg-card" style="animation-delay:${idx*0.03}s">
      <div class="body">
        <div class="title">${titleLinkHTML(d.title, d.city)}</div>
        ${dateBit ? `<div class="meta">${escapeHtml(dateBit)}</div>` : ''}
        <div class="meta">${escapeHtml(d.notes)}</div>
      </div>
      <button class="sg-add ${already?'added':''}" data-idx="${idx}" ${already?'disabled':''}>${already?'✓':'+'}</button>
    </div>`;
  });
  html += `</div>`;
  return html;
}
function wireDiscover(){
  document.querySelectorAll('.subtab[data-cat]').forEach(el => {
    el.onclick = () => { discoverCat = el.dataset.cat; render(); };
  });
  document.querySelectorAll('.subtab[data-city]').forEach(el => {
    el.onclick = () => { discoverCity = el.dataset.city; render(); };
  });
  const list = DISCOVER.filter(d => d.cat === discoverCat && d.city === discoverCity);
  document.querySelectorAll('.sg-add').forEach(btn => {
    btn.onclick = () => addDiscoverItem(list[Number(btn.dataset.idx)]);
  });
}
function addDiscoverItem(d){
  const type = (d.cat === 'bar') ? 'bar' : (d.cat === 'food') ? 'food' : 'activity';
  items.push({
    id: uid(), type, title: d.title, date: d.date || '', endDate: d.endDate || '',
    time:'', city: d.city, notes: d.notes, status:'idea'
  });
  persist();
  render();
  toast('Added to the trip');
}
const sheet = document.getElementById('sheet');
const scrim = document.getElementById('scrim');
let currentType = 'activity';
function buildTypeSelect(){
  const el = document.getElementById('typeSelect');
  el.innerHTML = Object.keys(ICONS).map(t =>
    `<div class="type-opt ${t===currentType?'sel':''}" data-t="${t}">${ICONS[t]}<span class="lbl">${TYPE_LABEL[t]}</span></div>`
  ).join('');
  [...el.children].forEach(o => o.onclick = () => { currentType = o.dataset.t; buildTypeSelect(); syncFieldsForType(); });
}
function syncFieldsForType(){
  document.getElementById('endDateWrap').style.display = currentType === 'stay' ? 'block' : 'none';
  document.getElementById('statusWrap').style.display = currentType === 'flight' ? 'none' : 'block';
}
function openSheet(){
  scrim.classList.add('open');
  sheet.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  scrim.classList.remove('open');
  sheet.classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('scrim').onclick = closeSheet;
document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && sheet.classList.contains('open')) closeSheet(); });
function openAdd(){
  editingId = null;
  document.getElementById('sheetTitle').textContent = 'Add to the trip';
  document.getElementById('btnDelete').style.display = 'none';
  currentType = 'activity';
  buildTypeSelect();
  syncFieldsForType();
  document.getElementById('fTitle').value = '';
  document.getElementById('fDate').value = '';
  document.getElementById('fTime').value = '';
  document.getElementById('fEndDate').value = '';
  document.getElementById('fCity').value = '';
  document.getElementById('fNotes').value = '';
  setStatus('idea');
  openSheet();
}
function openEdit(id){
  const item = items.find(i => i.id === id);
  if(!item) return;
  editingId = id;
  document.getElementById('sheetTitle').textContent = 'Edit';
  document.getElementById('btnDelete').style.display = 'block';
  currentType = item.type;
  buildTypeSelect();
  syncFieldsForType();
  document.getElementById('fTitle').value = item.title || '';
  document.getElementById('fDate').value = item.date || '';
  document.getElementById('fTime').value = item.time || '';
  document.getElementById('fEndDate').value = item.endDate || '';
  document.getElementById('fCity').value = item.city || '';
  document.getElementById('fNotes').value = item.notes || '';
  setStatus(item.status || 'idea');
  openSheet();
}
function setStatus(s){
  document.getElementById('btnIdea').classList.toggle('on', s === 'idea');
  document.getElementById('btnBooked').classList.toggle('on', s === 'booked');
}
document.getElementById('btnIdea').onclick = () => setStatus('idea');
document.getElementById('btnBooked').onclick = () => setStatus('booked');
document.getElementById('fabAdd').onclick = openAdd;
document.getElementById('btnSave').onclick = async () => {
  const title = document.getElementById('fTitle').value.trim();
  if(!title){ toast('Give it a title', true); return; }
  const status = document.getElementById('btnBooked').classList.contains('on') ? 'booked' : 'idea';
  const data = {
    type: currentType,
    title,
    date: document.getElementById('fDate').value,
    time: document.getElementById('fTime').value,
    endDate: currentType === 'stay' ? document.getElementById('fEndDate').value : '',
    city: document.getElementById('fCity').value.trim(),
    notes: document.getElementById('fNotes').value.trim(),
    status
  };
  if(editingId){
    const idx = items.findIndex(i => i.id === editingId);
    items[idx] = {...items[idx], ...data};
  } else {
    items.push({id: uid(), ...data});
  }
  closeSheet();
  render();
  await persist();
  toast('Saved');
};
document.getElementById('btnDelete').onclick = async () => {
  items = items.filter(i => i.id !== editingId);
  closeSheet();
  render();
  await persist();
  toast('Removed');
};
load();
setInterval(updateCountdown, 60000);
</script>
</body>
</html>
